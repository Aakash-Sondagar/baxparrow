# Railway — API service (monorepo root = /)
# In dashboard: Root Directory empty (/). Or set these Build/Start overrides.

[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm@9.0.0 && pnpm install --frozen-lockfile"

[deploy]
startCommand = "pnpm --filter @baxparrow/api start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
