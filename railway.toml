# Railway — API service (monorepo root = /)
# In dashboard: Root Directory empty (/). Or set these Build/Start overrides.

[build]
builder = "NIXPACKS"
buildCommand = "npx --yes pnpm@9.0.0 install --frozen-lockfile"

[deploy]
startCommand = "npx --yes pnpm@9.0.0 --filter @baxparrow/api start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
