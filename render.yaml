# Render Web Service — monorepo root
# Dashboard Root Directory: empty
# Do NOT use corepack enable or npm i -g (Render FS is read-only under /usr)

services:
  - type: web
    name: baxparrow-api
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@9.0.0 install --frozen-lockfile
    startCommand: npx --yes pnpm@9.0.0 --filter @baxparrow/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "4000"
      # Secrets in dashboard: MONGODB_URI, JWT_*, CLIENT_URL, RAZORPAY_*, CLOUDINARY_*, BREVO_*, MAIL_*
